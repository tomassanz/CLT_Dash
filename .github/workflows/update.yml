name: Update data

on:
  schedule:
    # Cada hora viernes-lunes (días con partidos): vie=5, sáb=6, dom=0, lun=1
    - cron: "0 * * * 5,6,0,1"
    # 08:30 Uruguay (11:30 UTC) martes-jueves: mar=2, mié=3, jue=4
    - cron: "30 11 * * 2,3,4"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Baseline match count
        id: baseline
        run: |
          count=$(python -c 'import json; print(len(json.load(open("frontend/public/data/matches.json"))))')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Run incremental extractor
        working-directory: scraper
        run: python extractor.py --incremental

      - name: Generate JSONs
        working-directory: scraper
        run: python json_generator.py

      - name: Health check
        env:
          BASELINE: ${{ steps.baseline.outputs.count }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          base = pathlib.Path("frontend/public/data")
          m = json.loads((base / "matches.json").read_text())
          assert isinstance(m, list) and len(m) > 0, "matches.json vacío"
          baseline = int(os.environ["BASELINE"])
          assert len(m) >= baseline, f"matches.json perdió partidos ({len(m)} < {baseline})"
          lu = json.loads((base / "last_updated.json").read_text())
          assert lu.get("updated_at") and lu.get("latest_season"), "last_updated.json inválido"
          fl = json.loads((base / "fixtures_live.json").read_text())
          cats = fl.get("categories", [])
          assert cats and any(c.get("matches") for c in cats), "fixtures_live.json sin partidos"
          print(f"OK — matches={len(m)} (baseline {baseline}), season={lu['latest_season']}")
          PY

      # Ignora el ruido de cada corrida (timestamps + bytes internos de SQLite)
      # para no commitear ~24 veces por día sin datos nuevos.
      - name: Detect changes
        id: diff
        run: python scraper/should_commit.py

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/clt.db frontend/public/data
          git commit -m "chore(data): actualización automática $(date -u +'%Y-%m-%d')"
          git push

      # El push del bot no dispara workflows (por diseño del GITHUB_TOKEN), así
      # que hay que llamar a gh-pages a mano. La API de GitHub devuelve 503 cada
      # tanto: se reintenta y, si igual no sale, se avisa sin romper el workflow
      # (los datos ya se pushearon y la próxima corrida vuelve a intentar).
      - name: Trigger GitHub Pages rebuild
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for delay in 5 15 30 60 0; do
            if gh workflow run gh-pages.yml --ref main; then
              echo "GitHub Pages rebuild disparado."
              exit 0
            fi
            if [ "$delay" -eq 0 ]; then break; fi
            echo "Falló el dispatch, reintentando en ${delay}s..."
            sleep "$delay"
          done
          echo "::warning::No se pudo disparar gh-pages.yml (API de GitHub caída). Los datos ya están en main y Vercel se actualizó igual; la próxima corrida con datos nuevos lo reintenta."
