name: Newsletter — Monitor de suscriptores

on:
  schedule:
    # Todos los jueves 11:00 Uruguay (14:00 UTC) — un día antes del envío de fixtures.
    # Antes corría el viernes, pero se comía un email del cupo justo el día del envío
    # grande. Corriendo el jueves además avisa con un día de anticipación.
    - cron: "0 14 * * 4"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Send subscriber count alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBERS_API_KEY: ${{ secrets.SUBSCRIBERS_API_KEY }}
        run: python scraper/monitor_newsletter.py
