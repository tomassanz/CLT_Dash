name: Newsletter — Enviar pendientes

# El plan gratuito de Resend corta a los 100 emails por día (día calendario UTC,
# o sea 21:00 en Uruguay). Si la lista de suscriptores no entra en un solo día,
# send_newsletter.py deja los que faltan en scraper/newsletter_queue.json y este
# workflow los manda cuando el cupo se renueva.
#
# Corre después de las 21:00 UY de los días de envío (martes y viernes). Cada
# corrida no hace nada si no hay pendientes, así que reintentar es gratis.

on:
  schedule:
    # 01:30 a 07:30 UTC = 22:30 a 04:30 hora de Uruguay, del miércoles y del
    # sábado (o sea la noche del martes y la del viernes, ya pasado el corte).
    # Se reintenta cada hora para aguantar el jitter del scheduler de Actions.
    - cron: "30 1-7 * * 3,6"
    # Un intento más tarde: si a esta altura sigue habiendo pendientes, la cola
    # ya venció y el script falla a propósito para que llegue el aviso por mail.
    - cron: "30 12 * * 3,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no envía emails reales)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Send pending newsletter emails
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--resume"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scraper/send_newsletter.py $ARGS

      - name: Commit queue state if changed
        if: always()
        run: |
          # El archivo puede no existir, que es el caso normal (no hubo pendientes).
          # git add falla con un pathspec inexistente, así que toleramos ese error:
          # si no hay nada que agregar, tampoco hay nada que commitear.
          git add -A -- scraper/newsletter_queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola — nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(newsletter): pendientes de envío $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
