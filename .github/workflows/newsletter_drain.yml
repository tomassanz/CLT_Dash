name: Newsletter — Enviar pendientes

# El plan gratuito de Resend corta a los 100 emails por día (día calendario UTC,
# o sea 21:00 en Uruguay). Si la lista de suscriptores no entra en un solo día,
# send_newsletter.py deja los que faltan en scraper/newsletter_queue.json y este
# workflow los manda cuando el cupo se renueva.
#
# Corre después de las 21:00 UY de los días de envío (martes y viernes). Cada
# corrida no hace nada si no hay pendientes, así que reintentar es gratis.

on:
  schedule:
    # 00:15 a 07:15 UTC = 21:15 a 04:15 hora de Uruguay, del miércoles y del
    # sábado (o sea la noche del martes y la del viernes). El primer intento cae
    # 15 minutos después del corte de las 21:00 UY, así los que quedaron
    # pendientes reciben el mail esa misma noche y lo antes posible.
    # Se reintenta cada hora: el scheduler de Actions arranca tarde (el envío del
    # 11/09 salió 3h17 después de su horario), nunca temprano, así que el margen
    # de 15 minutos es seguro y las corridas de más no cuestan nada.
    - cron: "15 0-7 * * 3,6"
    # Barrido diario a las 09:15 UY. Si el envío se disparó muy tarde, la cola
    # puede nacer después de la ventana de arriba; esto la levanta igual, y si ya
    # venció hace fallar el workflow a propósito para que llegue el aviso.
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no envía emails reales)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Send pending newsletter emails
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--resume"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scraper/send_newsletter.py $ARGS

      - name: Commit queue state if changed
        if: always()
        run: |
          # El archivo puede no existir, que es el caso normal (no hubo pendientes).
          # git add falla con un pathspec inexistente, así que toleramos ese error:
          # si no hay nada que agregar, tampoco hay nada que commitear.
          git add -A -- scraper/newsletter_queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola — nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(newsletter): pendientes de envío $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
