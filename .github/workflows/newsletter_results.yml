name: Newsletter — Resultados del finde

on:
  schedule:
    # Martes 10:00 Uruguay (13:00 UTC)
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no envía emails reales)"
        type: boolean
        default: false
      only:
        description: "Solo enviar a estos emails (separados por coma). Dejar vacío para enviar a todos."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: newsletter-results
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Send results newsletter
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBERS_API_KEY: ${{ secrets.SUBSCRIBERS_API_KEY }}
          ONLY_EMAILS: ${{ github.event.inputs.only }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--results"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$ONLY_EMAILS" ]; then ARGS="$ARGS --only=$ONLY_EMAILS"; fi
          python scraper/send_newsletter.py $ARGS

      - name: Commit queue state if changed
        if: always()
        run: |
          # El archivo puede no existir, que es el caso normal (no hubo pendientes).
          # git add falla con un pathspec inexistente, así que toleramos ese error:
          # si no hay nada que agregar, tampoco hay nada que commitear.
          git add -A -- scraper/newsletter_queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin pendientes — nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(newsletter): pendientes de envío $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
