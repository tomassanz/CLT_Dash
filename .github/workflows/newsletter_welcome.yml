name: Newsletter — Bienvenida a nuevos suscriptores

on:
  schedule:
    # Cada hora al minuto 40 (evita pisarse con "Update data" que corre al minuto 0).
    # Días 0,1,3,4,6 = todos menos martes y viernes: esos son los días de envío del
    # newsletter y el cupo diario de Resend (100) queda reservado para él.
    #
    # Los días de cron son UTC, así que la pausa cubre justo el día de cupo del
    # envío y se reanuda a las 00:40 UTC = 21:40 de Uruguay, apenas renovado el
    # cupo. O sea: a quien se anota un martes o un viernes la bienvenida le llega
    # esa misma noche después de las 21:40, no al día siguiente.
    - cron: "40 * * * 0,1,3,4,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no envía emails reales)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter-welcome
  cancel-in-progress: false

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Send welcome emails to new subscribers
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBERS_API_KEY: ${{ secrets.SUBSCRIBERS_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          python scraper/send_welcome.py $ARGS

      - name: Commit state if changed
        run: |
          git add scraper/welcomed_emails.json
          if git diff --cached --quiet; then
            echo "No new welcomes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(newsletter): registro de bienvenidas $(date -u +'%Y-%m-%d %H:%M')"
          # "Update data" también pushea a main — rebase por si se cruzan
          git pull --rebase origin main
          git push
